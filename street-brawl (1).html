<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ STREET BRAWL - ULTIMATE EDITION ⚔️</title>
    <style>
        /* ============================================================
           CSS ULTRA-PROFISSIONAL - DESIGN PREMIUM
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Black+Ops+One&display=swap');

        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            padding: 10px;
            overflow: hidden;
            position: relative;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 160px 120px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 200px 50px, #eee, transparent);
            background-size: 200px 200px;
            animation: starsMove 60s linear infinite;
        }

        @keyframes starsMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(-200px); }
        }

        .game-wrapper {
            background: linear-gradient(145deg, #14181f, #0a0e14);
            padding: 25px 30px 30px;
            border-radius: 60px;
            box-shadow:
                0 40px 80px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.05),
                0 0 100px rgba(247, 212, 74, 0.03);
            position: relative;
            max-width: 960px;
            width: 100%;
            border: 1px solid rgba(247, 212, 74, 0.08);
            z-index: 1;
        }

        .game-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 62px;
            background: linear-gradient(135deg, rgba(247, 212, 74, 0.15), transparent 40%, transparent 60%, rgba(247, 212, 74, 0.15));
            z-index: -1;
            animation: borderGlow 4s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        canvas {
            display: block;
            margin: 0 auto;
            width: 100%;
            height: auto;
            aspect-ratio: 900/450;
            border-radius: 32px;
            box-shadow:
                inset 0 0 60px rgba(0, 0, 0, 0.7),
                0 20px 40px rgba(0, 0, 0, 0.6);
            background: #1a2a3a;
            cursor: none;
            transition: filter 0.3s;
        }

        /* ===== HUD ===== */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 8px 0;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hud-left, .hud-right {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .health-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 14, 20, 0.8);
            padding: 6px 18px 6px 14px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .health-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }

        .health-label {
            font-family: 'Orbitron', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            color: #8ab4d6;
            text-shadow: 0 0 20px rgba(138, 180, 214, 0.2);
            letter-spacing: 2px;
            min-width: 28px;
        }

        .health-bg {
            width: 140px;
            height: 20px;
            background: rgba(30, 15, 15, 0.8);
            border-radius: 30px;
            overflow: hidden;
            box-shadow: inset 0 3px 12px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .health-bg::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 30px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent);
            pointer-events: none;
        }

        .health-fill {
            height: 100%;
            width: 100%;
            border-radius: 30px;
            transition: width 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.2);
        }

        .health-fill::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 8px;
            right: 8px;
            height: 5px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 10px;
        }

        .health-fill.p1 {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            box-shadow: 0 0 40px rgba(46, 204, 113, 0.3);
        }

        .health-fill.p2 {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
            box-shadow: 0 0 40px rgba(231, 76, 60, 0.3);
        }

        .health-fill.danger {
            animation: dangerPulse 0.5s ease-in-out infinite;
        }

        @keyframes dangerPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .special-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(10, 14, 20, 0.8);
            padding: 4px 14px 4px 10px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .special-bg {
            width: 70px;
            height: 8px;
            background: rgba(20, 10, 40, 0.8);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .special-fill {
            height: 100%;
            width: 0%;
            border-radius: 20px;
            transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, #f7d44a, #ff6b00);
            box-shadow: 0 0 30px rgba(247, 212, 74, 0.3);
        }

        .special-fill.full {
            animation: specialGlow 0.6s ease-in-out infinite;
        }

        @keyframes specialGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(247, 212, 74, 0.3); }
            50% { box-shadow: 0 0 60px rgba(247, 212, 74, 0.6), 0 0 100px rgba(255, 107, 0, 0.3); }
        }

        .special-label {
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            color: #f7d44a;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .controls-hud {
            display: flex;
            gap: 10px;
            align-items: center;
            background: rgba(10, 14, 20, 0.8);
            padding: 6px 18px 6px 14px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.65rem;
            color: rgba(176, 208, 224, 0.7);
            flex-wrap: wrap;
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .key {
            background: rgba(30, 51, 69, 0.6);
            padding: 2px 10px;
            border-radius: 8px;
            font-family: 'Orbitron', monospace;
            font-size: 0.55rem;
            font-weight: 700;
            color: #b0d0e0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
        }

        .key.special-key {
            background: linear-gradient(135deg, rgba(247, 212, 74, 0.2), rgba(255, 107, 0, 0.2));
            color: #f7d44a;
            border-color: rgba(247, 212, 74, 0.2);
        }

        .vs-badge {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            font-weight: 900;
            color: #f7d44a;
            text-shadow: 0 0 30px rgba(247, 212, 74, 0.2);
            animation: vsPulse 2s ease-in-out infinite;
            padding: 0 4px;
        }

        @keyframes vsPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .winner-display {
            font-family: 'Orbitron', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            background: rgba(10, 14, 20, 0.8);
            padding: 6px 22px;
            border-radius: 50px;
            color: #fadf8a;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(247, 212, 74, 0.1);
            min-width: 160px;
            text-align: center;
            letter-spacing: 1px;
            box-shadow: inset 0 2px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.5s;
        }

        .winner-display.victory {
            border-color: #f7d44a;
            box-shadow: 0 0 40px rgba(247, 212, 74, 0.1), inset 0 2px 20px rgba(0, 0, 0, 0.5);
            animation: victoryPulse 1s ease-in-out infinite;
        }

        @keyframes victoryPulse {
            0%, 100% { border-color: #f7d44a; }
            50% { border-color: #ff6b00; }
        }

        .btn-reset, .btn-menu {
            background: linear-gradient(135deg, rgba(42, 74, 90, 0.6), rgba(26, 42, 58, 0.6));
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Orbitron', monospace;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 8px 22px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-reset:hover, .btn-menu:hover {
            background: linear-gradient(135deg, rgba(42, 74, 90, 0.9), rgba(26, 42, 58, 0.9));
            color: #fff;
            border-color: rgba(247, 212, 74, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .btn-reset:active, .btn-menu:active {
            transform: translateY(1px);
        }

        .btn-menu {
            background: linear-gradient(135deg, rgba(74, 42, 90, 0.6), rgba(42, 26, 58, 0.6));
            border-color: rgba(180, 100, 200, 0.1);
        }

        .btn-menu:hover {
            background: linear-gradient(135deg, rgba(74, 42, 90, 0.9), rgba(42, 26, 58, 0.9));
            border-color: rgba(180, 100, 200, 0.3);
        }

        .hud-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* ===== TELA DE SELEÇÃO ===== */
        .char-select {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 60px;
            z-index: 20;
            padding: 20px 25px;
            backdrop-filter: blur(20px);
            animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .char-select.hidden {
            display: none;
        }

        .char-select h2 {
            font-family: 'Black Ops One', 'Orbitron', monospace;
            color: #f7d44a;
            font-size: 1.6rem;
            text-shadow: 0 0 60px rgba(247, 212, 74, 0.2);
            margin-bottom: 4px;
            letter-spacing: 4px;
        }

        .char-select .subtitle {
            color: rgba(139, 180, 204, 0.7);
            font-size: 0.75rem;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 3px;
            animation: blinkText 1.5s ease-in-out infinite;
        }

        @keyframes blinkText {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.3; }
        }

        .char-grid {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 700px;
        }

        .char-card {
            background: linear-gradient(145deg, rgba(26, 42, 56, 0.6), rgba(13, 26, 36, 0.6));
            padding: 12px 14px;
            border-radius: 22px;
            text-align: center;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.04);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            min-width: 80px;
            flex: 1;
            max-width: 110px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .char-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(247, 212, 74, 0.05), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .char-card:hover::before {
            opacity: 1;
        }

        .char-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(247, 212, 74, 0.2);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.5);
        }

        .char-card.selected {
            border-color: #f7d44a;
            background: linear-gradient(145deg, rgba(247, 212, 74, 0.08), rgba(13, 26, 36, 0.6));
            box-shadow: 0 0 60px rgba(247, 212, 74, 0.05), 0 16px 50px rgba(0, 0, 0, 0.5);
            transform: translateY(-6px) scale(1.02);
        }

        .char-card.selected::after {
            content: '✦';
            position: absolute;
            top: 4px;
            right: 8px;
            color: #f7d44a;
            font-size: 0.8rem;
            animation: starSpin 3s linear infinite;
        }

        @keyframes starSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .char-card .emoji {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 2px;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.5));
            transition: transform 0.3s;
        }

        .char-card:hover .emoji {
            transform: scale(1.1) rotate(-5deg);
        }

        .char-card .name {
            color: #ecf9ff;
            font-weight: 600;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .char-card .stats {
            color: rgba(139, 180, 204, 0.6);
            font-size: 0.4rem;
            margin-top: 2px;
            line-height: 1.4;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* ===== PERSONALIZAÇÃO DE NOME ===== */
        .name-customization {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 8px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(13, 26, 36, 0.6);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .name-customization label {
            color: rgba(179, 214, 240, 0.7);
            font-size: 0.6rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .name-customization .name-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .name-customization .name-input-group span {
            color: rgba(179, 214, 240, 0.4);
            font-size: 0.7rem;
        }

        .name-customization input[type="text"] {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #ecf9ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            width: 120px;
            transition: all 0.3s;
            text-align: center;
        }

        .name-customization input[type="text"]:focus {
            outline: none;
            border-color: rgba(247, 212, 74, 0.2);
            box-shadow: 0 0 20px rgba(247, 212, 74, 0.05);
        }

        .name-customization .name-save-btn {
            background: rgba(247, 212, 74, 0.1);
            border: 1px solid rgba(247, 212, 74, 0.15);
            color: #f7d44a;
            padding: 3px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.55rem;
            font-weight: 600;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .name-customization .name-save-btn:hover {
            background: rgba(247, 212, 74, 0.2);
            border-color: rgba(247, 212, 74, 0.3);
            transform: scale(1.02);
        }

        .mode-select {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-select label {
            color: rgba(179, 214, 240, 0.6);
            font-size: 0.65rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .mode-btn {
            background: rgba(13, 26, 36, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(179, 214, 240, 0.6);
            padding: 3px 12px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.6rem;
            letter-spacing: 0.5px;
        }

        .mode-btn:hover {
            border-color: rgba(247, 212, 74, 0.2);
            color: #ecf9ff;
            background: rgba(26, 42, 56, 0.6);
            transform: translateY(-2px);
        }

        .mode-btn.active {
            border-color: #f7d44a;
            color: #f7d44a;
            background: rgba(247, 212, 74, 0.1);
            box-shadow: 0 0 30px rgba(247, 212, 74, 0.05);
        }

        .difficulty-select {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .difficulty-select label {
            color: rgba(179, 214, 240, 0.6);
            font-size: 0.6rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .diff-btn {
            background: rgba(13, 26, 36, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(179, 214, 240, 0.6);
            padding: 2px 10px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.5rem;
            letter-spacing: 0.5px;
        }

        .diff-btn:hover {
            border-color: rgba(247, 212, 74, 0.2);
            color: #ecf9ff;
            background: rgba(26, 42, 56, 0.6);
            transform: translateY(-2px);
        }

        .diff-btn.active {
            border-color: #f7d44a;
            color: #f7d44a;
            background: rgba(247, 212, 74, 0.1);
            box-shadow: 0 0 30px rgba(247, 212, 74, 0.05);
        }

        .diff-btn.easy { border-color: rgba(46, 204, 113, 0.2); color: #2ecc71; }
        .diff-btn.easy.active { border-color: #2ecc71; color: #2ecc71; background: rgba(46, 204, 113, 0.1); }
        .diff-btn.medium { border-color: rgba(241, 196, 15, 0.2); color: #f1c40f; }
        .diff-btn.medium.active { border-color: #f1c40f; color: #f1c40f; background: rgba(241, 196, 15, 0.1); }
        .diff-btn.hard { border-color: rgba(231, 76, 60, 0.2); color: #e74c3c; }
        .diff-btn.hard.active { border-color: #e74c3c; color: #e74c3c; background: rgba(231, 76, 60, 0.1); }
        .diff-btn.impossible { border-color: rgba(155, 89, 182, 0.3); color: #9b59b6; text-shadow: 0 0 20px rgba(155, 89, 182, 0.3); }
        .diff-btn.impossible.active { border-color: #9b59b6; color: #9b59b6; background: rgba(155, 89, 182, 0.15); box-shadow: 0 0 40px rgba(155, 89, 182, 0.15); }

        .stage-select {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stage-select label {
            color: rgba(179, 214, 240, 0.6);
            font-size: 0.65rem;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .stage-btn {
            background: rgba(13, 26, 36, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(179, 214, 240, 0.6);
            padding: 3px 12px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.6rem;
            letter-spacing: 0.5px;
        }

        .stage-btn:hover {
            border-color: rgba(247, 212, 74, 0.2);
            color: #ecf9ff;
            background: rgba(26, 42, 56, 0.6);
            transform: translateY(-2px);
        }

        .stage-btn.active {
            border-color: #f7d44a;
            color: #f7d44a;
            background: rgba(247, 212, 74, 0.1);
            box-shadow: 0 0 30px rgba(247, 212, 74, 0.05);
        }

        .select-preview {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 10px;
            color: rgba(179, 214, 240, 0.6);
            font-size: 0.7rem;
            font-weight: 300;
            letter-spacing: 1px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .select-preview span {
            background: rgba(13, 26, 36, 0.6);
            padding: 3px 14px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            min-width: 90px;
            text-align: center;
        }

        .select-preview .vs-divider {
            color: #f7d44a;
            font-size: 1.2rem;
            font-weight: 900;
            text-shadow: 0 0 40px rgba(247, 212, 74, 0.2);
        }

        .btn-start {
            margin-top: 12px;
            background: linear-gradient(135deg, #f7d44a, #e6b800);
            border: none;
            color: #0a0a0f;
            font-family: 'Black Ops One', 'Orbitron', monospace;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 8px 40px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 0 #a88300, 0 12px 40px rgba(0, 0, 0, 0.5);
            letter-spacing: 3px;
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 0 #a88300, 0 20px 60px rgba(247, 212, 74, 0.15);
        }

        .btn-start:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #a88300;
        }

        .btn-start:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== COMBO DISPLAY ===== */
        .combo-display {
            position: absolute;
            top: 32%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Black Ops One', 'Orbitron', monospace;
            font-size: 4rem;
            font-weight: 900;
            color: #f7d44a;
            text-shadow:
                0 0 60px rgba(247, 212, 74, 0.3),
                0 4px 30px rgba(0, 0, 0, 0.8),
                0 0 120px rgba(247, 212, 74, 0.1);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 10;
            letter-spacing: 4px;
        }

        .combo-display.show {
            opacity: 1;
            animation: comboPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes comboPop {
            0% { transform: translate(-50%, -50%) scale(0.3) rotate(-10deg); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }

        .combo-display.mega {
            color: #ff4400;
            text-shadow:
                0 0 80px rgba(255, 68, 0, 0.4),
                0 4px 30px rgba(0, 0, 0, 0.8),
                0 0 150px rgba(255, 68, 0, 0.2);
            animation: megaCombo 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes megaCombo {
            0% { transform: translate(-50%, -50%) scale(0.2) rotate(-20deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.4) rotate(5deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }

        .flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 60px;
            background: white;
            opacity: 0;
            z-index: 5;
            transition: opacity 0.05s;
        }

        @media (max-width: 768px) {
            .game-wrapper { padding: 14px; border-radius: 40px; }
            .health-bg { width: 80px; height: 16px; }
            .char-card { min-width: 60px; padding: 8px 10px; }
            .char-card .emoji { font-size: 2rem; }

            .key { font-size: 0.45rem; padding: 2px 6px; }
            .btn-reset, .btn-menu { font-size: 0.45rem; padding: 5px 14px; }
            .btn-start { font-size: 0.6rem; padding: 8px 28px; }
            .select-preview span { min-width: 70px; font-size: 0.6rem; padding: 3px 10px; }
            .special-bg { width: 45px; height: 6px; }
            .combo-display { font-size: 2.5rem; top: 28%; }
            .health-label { font-size: 0.5rem; min-width: 20px; }
            .vs-badge { font-size: 0.8rem; }
            .char-select { padding: 12px 15px; border-radius: 40px; }
            .char-grid { gap: 6px; }
            .flash-overlay { border-radius: 40px; }
            .stage-select { gap: 4px; }
            .stage-btn { font-size: 0.5rem; padding: 2px 8px; }
            .stage-select label { font-size: 0.55rem; }
            .mode-btn { font-size: 0.5rem; padding: 2px 8px; }
            .diff-btn { font-size: 0.45rem; padding: 2px 6px; }
            .name-customization { padding: 6px 12px; gap: 10px; }
            .name-customization input[type="text"] { width: 90px; font-size: 0.6rem; }
        }

        @media (max-width: 480px) {
            .game-wrapper { padding: 8px; border-radius: 30px; }
            .hud { gap: 4px; margin-top: 8px; }
            .health-container { padding: 4px 8px; gap: 4px; }

            .char-card { min-width: 45px; padding: 5px 5px; }

            .winner-display { min-width: 60px; font-size: 0.4rem; padding: 3px 8px; }
            .key { font-size: 0.35rem; padding: 1px 4px; }
            .combo-display { font-size: 1.8rem; top: 25%; }
            .btn-start { font-size: 0.5rem; padding: 6px 18px; }
            .select-preview span { min-width: 50px; font-size: 0.45rem; padding: 2px 6px; }

            .flash-overlay { border-radius: 30px; }
            .stage-btn { font-size: 0.45rem; padding: 2px 6px; }

            .name-customization input[type="text"] { width: 70px; font-size: 0.5rem; padding: 3px 8px; }
        }
    </style>
</head>

<script>
// ============================================================
// SISTEMA DE PERSONALIZAÇÃO DE NOME
// ============================================================
class NameCustomization {
    constructor() {
        this.saveKey = 'streetBrawlPlayerNames';
        this.names = this.loadNames();
        this.setupUI();
        this.setupEventListeners();
    }

    loadNames() {
        try {
            const saved = localStorage.getItem(this.saveKey);
            if (saved) return JSON.parse(saved);
        } catch (e) {}
        return { p1: 'P1', p2: 'P2' };
    }

    saveNames() {
        try {
            localStorage.setItem(this.saveKey, JSON.stringify(this.names));
        } catch (e) {}
    }

    setupUI() {
        const p1Input = document.getElementById('p1NameInput');
        const p2Input = document.getElementById('p2NameInput');
        if (p1Input) p1Input.value = this.names.p1 || 'P1';
        if (p2Input) p2Input.value = this.names.p2 || 'P2';
    }

    setupEventListeners() {
        document.getElementById('saveP1Name')?.addEventListener('click', () => {
            const input = document.getElementById('p1NameInput');
            const name = input.value.trim() || 'P1';
            this.names.p1 = name;
            this.saveNames();
            this.updateHUD();
            input.blur();
            input.style.borderColor = 'rgba(46,204,113,0.4)';
            setTimeout(() => input.style.borderColor = '', 1000);
        });

        document.getElementById('saveP2Name')?.addEventListener('click', () => {
            const input = document.getElementById('p2NameInput');
            const name = input.value.trim() || 'P2';
            this.names.p2 = name;
            this.saveNames();
            this.updateHUD();
            input.blur();
            input.style.borderColor = 'rgba(46,204,113,0.4)';
            setTimeout(() => input.style.borderColor = '', 1000);
        });

        document.getElementById('p1NameInput')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('saveP1Name').click();
        });
        document.getElementById('p2NameInput')?.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('saveP2Name').click();
        });

        this.updateHUD();
    }

    getPlayerName(player) {
        return this.names[player] || (player === 'p1' ? 'P1' : 'P2');
    }

    updateHUD() {
        const p1Label = document.getElementById('p1Label');
        const p2Label = document.getElementById('p2Label');
        if (p1Label) p1Label.textContent = this.names.p1 || 'P1';
        if (p2Label) p2Label.textContent = this.names.p2 || 'P2';
    }

    updatePreview(player, charEmoji, charName) {
        const name = this.names[player] || (player === 'p1' ? 'P1' : 'P2');
        const preview = document.getElementById(player === 'p1' ? 'p1Preview' : 'p2Preview');
        if (preview) {
            preview.textContent = `${name}: ${charEmoji} ${charName}`;
        }
    }
}

const nameSystem = new NameCustomization();
window.nameSystem = nameSystem;

// ============================================================
// CÓDIGO ORIGINAL DO JOGO COM PERSONAGENS MELHORADOS
// ============================================================

(function() {
    'use strict';

    // --- DOM ELEMENTS ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 900, H = 450;

    const healthP1 = document.getElementById('healthP1');
    const healthP2 = document.getElementById('healthP2');
    const specialP1 = document.getElementById('specialP1');
    const specialP2 = document.getElementById('specialP2');
    const winnerDisplay = document.getElementById('winnerDisplay');
    const p1Label = document.getElementById('p1Label');
    const p2Label = document.getElementById('p2Label');
    const comboDisplay = document.getElementById('comboDisplay');
    const flashOverlay = document.getElementById('flashOverlay');

    const charSelect = document.getElementById('charSelect');
    const charCards = document.querySelectorAll('.char-card');
    const startBtn = document.getElementById('startBtn');
    const p1Preview = document.getElementById('p1Preview');
    const p2Preview = document.getElementById('p2Preview');
    const selectInstruction = document.getElementById('selectInstruction');
    const menuBtn = document.getElementById('menuBtn');
    const resetBtn = document.getElementById('resetBtn');

    // --- MODO E DIFICULDADE ---
    let gameMode = 'pvp';
    let difficulty = 'easy';
    let isBotMode = false;

    const modeBtns = document.querySelectorAll('.mode-btn');
    const diffBtns = document.querySelectorAll('.diff-btn');
    const difficultySelect = document.getElementById('difficultySelect');

    modeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            modeBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            gameMode = btn.dataset.mode;
            isBotMode = gameMode === 'bot';
            difficultySelect.style.display = isBotMode ? 'flex' : 'none';
        });
    });

    diffBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            diffBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            difficulty = btn.dataset.diff;
        });
    });

    difficultySelect.style.display = 'none';

    // --- STAGE SELECTION ---
    let selectedStage = 'dojo';
    const stageBtns = document.querySelectorAll('.stage-btn');

    stageBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            stageBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedStage = btn.dataset.stage;
        });
    });

    // ============================================================
    // CENÁRIOS (MANTIDOS IGUAIS)
    // ============================================================
    const STAGES = {
        dojo: {
            name: 'Dojo',
            groundY: 355,
            draw: function() {
                const GY = this.groundY;
                const wallGrad = ctx.createLinearGradient(0, 0, 0, GY);
                wallGrad.addColorStop(0, '#2a1a0a');
                wallGrad.addColorStop(0.3, '#3a2a1a');
                wallGrad.addColorStop(0.7, '#4a3a2a');
                wallGrad.addColorStop(1, '#2a1a0a');
                ctx.fillStyle = wallGrad;
                ctx.fillRect(0, 0, W, GY);
                for (let i = 0; i < 12; i++) {
                    const x = i * 75;
                    ctx.fillStyle = i % 2 === 0 ? 'rgba(60,40,20,0.3)' : 'rgba(80,50,30,0.2)';
                    ctx.fillRect(x, 30, 75, GY - 80);
                    ctx.fillStyle = 'rgba(40,25,10,0.2)';
                    ctx.fillRect(x + 2, 35, 71, GY - 90);
                }
                ctx.strokeStyle = 'rgba(50,30,15,0.3)';
                ctx.lineWidth = 1;
                for (let y = 60; y < GY - 40; y += 40) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(W, y);
                    ctx.stroke();
                }
                const drawPillar = (x, y, h) => {
                    const grad = ctx.createLinearGradient(x - 8, y, x + 8, y);
                    grad.addColorStop(0, '#3a2a1a');
                    grad.addColorStop(0.3, '#6a4a3a');
                    grad.addColorStop(0.7, '#5a3a2a');
                    grad.addColorStop(1, '#2a1a0a');
                    ctx.fillStyle = grad;
                    ctx.fillRect(x - 8, y, 16, h);
                    ctx.fillStyle = '#4a3a2a';
                    ctx.fillRect(x - 12, y + h - 8, 24, 8);
                    ctx.fillRect(x - 10, y + h - 12, 20, 4);
                    ctx.fillRect(x - 12, y - 4, 24, 8);
                    ctx.fillRect(x - 10, y - 8, 20, 4);
                };
                drawPillar(60, 30, GY - 50);
                drawPillar(840, 30, GY - 50);
                drawPillar(300, 30, GY - 50);
                drawPillar(600, 30, GY - 50);
                const tatameGrad = ctx.createLinearGradient(0, GY, 0, H);
                tatameGrad.addColorStop(0, '#c4a87a');
                tatameGrad.addColorStop(0.3, '#b8986a');
                tatameGrad.addColorStop(0.7, '#a8885a');
                tatameGrad.addColorStop(1, '#8a784a');
                ctx.fillStyle = tatameGrad;
                ctx.fillRect(0, GY + 4, W, H - GY);
                ctx.fillStyle = 'rgba(60,40,20,0.3)';
                ctx.fillRect(20, GY + 4, W - 40, 6);
                ctx.fillRect(20, H - 10, W - 40, 6);
                ctx.fillRect(20, GY + 4, 6, H - GY - 14);
                ctx.fillRect(W - 26, GY + 4, 6, H - GY - 14);
                for (let i = 0; i < 12; i++) {
                    const x = 40 + i * 75;
                    ctx.strokeStyle = 'rgba(80,60,30,0.15)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x, GY + 12);
                    ctx.lineTo(x, H - 12);
                    ctx.stroke();
                }
                ctx.fillStyle = 'rgba(200,180,150,0.08)';
                ctx.font = 'bold 80px "serif"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('武', W/2, GY/2 + 20);
                const lightGrad = ctx.createRadialGradient(W/2, 10, 10, W/2, 10, 200);
                lightGrad.addColorStop(0, 'rgba(255,220,150,0.15)');
                lightGrad.addColorStop(0.5, 'rgba(255,220,150,0.05)');
                lightGrad.addColorStop(1, 'rgba(255,220,150,0)');
                ctx.fillStyle = lightGrad;
                ctx.fillRect(0, 0, W, 200);
                ctx.fillStyle = 'rgba(0,0,0,0.05)';
                ctx.fillRect(52, GY + 8, 24, 12);
                ctx.fillRect(292, GY + 8, 24, 12);
                ctx.fillRect(592, GY + 8, 24, 12);
                ctx.fillRect(832, GY + 8, 24, 12);
            }
        },
        beach: {
            name: 'Beach',
            groundY: 355,
            draw: function() {
                const GY = this.groundY;
                const skyGrad = ctx.createLinearGradient(0, 0, 0, GY);
                skyGrad.addColorStop(0, '#1a7abf');
                skyGrad.addColorStop(0.3, '#4a9acf');
                skyGrad.addColorStop(0.6, '#87CEEB');
                skyGrad.addColorStop(0.85, '#b8d8e8');
                skyGrad.addColorStop(1, '#e8d8b8');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, GY);
                const sunGrad = ctx.createRadialGradient(750, 55, 5, 750, 55, 80);
                sunGrad.addColorStop(0, 'rgba(255,255,200,1)');
                sunGrad.addColorStop(0.2, 'rgba(255,220,100,0.9)');
                sunGrad.addColorStop(0.5, 'rgba(255,200,50,0.4)');
                sunGrad.addColorStop(1, 'rgba(255,200,50,0)');
                ctx.fillStyle = sunGrad;
                ctx.beginPath();
                ctx.arc(750, 55, 80, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fffbe0';
                ctx.shadowBlur = 60;
                ctx.shadowColor = 'rgba(255,200,50,0.4)';
                ctx.beginPath();
                ctx.arc(750, 55, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                const drawCloud = (x, y, s) => {

    // --- AUDIO ---
    class AudioManager {
        constructor() {
            this.enabled = true;
            try {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                this.enabled = false;
            }
        }

        playHit() {
            if (!this.enabled) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.start(this.ctx.currentTime);
                osc.stop(this.ctx.currentTime + 0.1);
            } catch (e) {}
        }

        playSpecial() {
            if (!this.enabled) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.start(this.ctx.currentTime);
                osc.stop(this.ctx.currentTime + 0.3);
            } catch (e) {}
        }

        playVictory() {
            if (!this.enabled) return;
            try {
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.15 + 0.2);
                    osc.start(this.ctx.currentTime + i * 0.15);
                    osc.stop(this.ctx.currentTime + i * 0.15 + 0.2);
                });
            } catch (e) {}
        }
    }

    // ============================================================
    // UTILIDADES DE COR
    // ============================================================

    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : { r: 128, g: 128, b: 128 };
    }

    function rgbToHex(r, g, b) {
        return '#' + [r, g, b].map(c => Math.min(255, Math.max(0, Math.round(c))).toString(16).padStart(2, '0')).join('');
    }

    function lightenColor(hex, percent) {
        const { r, g, b } = hexToRgb(hex);
        return rgbToHex(
            r + (255 - r) * (percent / 100),
            g + (255 - g) * (percent / 100),
            b + (255 - b) * (percent / 100)
        );
    }

    function darkenColor(hex, percent) {
        const { r, g, b } = hexToRgb(hex);
        return rgbToHex(
            r * (1 - percent / 100),
            g * (1 - percent / 100),
            b * (1 - percent / 100)
        );
    }

    // ============================================================
    // DRAW FIGHTER - FUNÇÃO PRINCIPAL
    // ============================================================

    function drawFighter(f) {
        if (!f) return;
        const x = f.x, y = f.y, w = f.w, h = f.h, d = f.direction;
        const GY = STAGES[selectedStage].groundY || 355;
        const breath = Math.sin(f.breathPhase) * 0.6;

        ctx.save();

        // Sombra
        ctx.shadowBlur = 25;
        ctx.shadowOffsetY = 8;
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.beginPath();
        ctx.ellipse(x + w / 2, GY + 6, 22, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Flip
        ctx.translate(x + w / 2, 0);
        ctx.scale(d, 1);
        ctx.translate(-(x + w / 2), 0);

        // Hit effect
        if (f.hitEffectTimer > 0 && f.hitEffectTimer % 4 < 2) {
            ctx.shadowColor = '#ffffffaa';
            ctx.shadowBlur = 50;
        }

        // Chamar a função de desenho específica de cada personagem
        const fn = {
            'boxer': drawBoxer,
            'ninja': drawNinja,
            'samurai': drawSamurai,
            'wrestler': drawLutador,
            'cyborg': drawCyborg
        }[f.charKey] || drawBoxer;

        fn(f, x, y, w, h, breath, 0, 0);

        // Special ready aura
        if (f.special >= SPECIAL_COST) {
            const pulse = Math.sin(frameCount * 0.05) * 0.3 + 0.7;
            ctx.shadowBlur = 50;
            ctx.shadowColor = `rgba(247,212,74,${0.22 * pulse})`;
            ctx.strokeStyle = `rgba(247,212,74,${0.18 * pulse})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(x - 7, y - 10, w + 14, h + 16, 16);
            ctx.stroke();
        }

        ctx.restore();
    }

    // --- INIT GAME ---
    function initGame() {
        if (!selectedP1 || !selectedP2) return;

        const GY = STAGES[selectedStage].groundY || 355;
        const isBot = gameMode === 'bot';
        
        p1 = createFighter(selectedP1, true, 140);
        p2 = createFighter(selectedP2, false, 720);
        
        if (isBot) {
            p2.charName = '🤖 BOT';
        }

        gameOver = false;
        winner = null;
        gameStarted = true;
        comboCount = 0;
        comboTimer = 0;
        particles = [];
        hitSparks = [];
        textEffects = [];
        botTimer = 0;
        botAction = 'idle';
        botCooldown = 0;

        charSelect.classList.add('hidden');
        updateHUD();

        p2Preview.textContent = 'P2: ⚪ None';

    // --- UPDATE HUD ---
    function updateHUD() {
        if (p1 && p2) {
            const p1p = Math.max(0, (p1.health / p1.maxHealth) * 100);
            const p2p = Math.max(0, (p2.health / p2.maxHealth) * 100);
            healthP1.style.width = p1p + '%';
            healthP2.style.width = p2p + '%';
            healthP1.className = 'health-fill p1' + (p1.health < 25 ? ' danger' : '');
            healthP2.className = 'health-fill p2' + (p2.health < 25 ? ' danger' : '');

            const s1 = (p1.special / p1.maxSpecial) * 100;
            const s2 = (p2.special / p2.maxSpecial) * 100;
            specialP1.style.width = Math.min(100, s1) + '%';
            specialP2.style.width = Math.min(100, s2) + '%';

            if (p1.special >= SPECIAL_COST) specialP1.classList.add('full');
            else specialP1.classList.remove('full');
            if (p2.special >= SPECIAL_COST) specialP2.classList.add('full');
            else specialP2.classList.remove('full');

            if (gameOver && winner) {
                const name = winner === 'p1' ? p1.charName : p2.charName;
                const emoji = winner === 'p1' ? CHARACTERS[selectedP1].emoji : CHARACTERS[selectedP2].emoji;
                winnerDisplay.textContent = `🏆 ${emoji} ${name}`;
                winnerDisplay.className = 'winner-display victory';
                audio.playVictory();
            }
        } else {
            healthP1.style.width = '100%';
            healthP2.style.width = '100%';
            specialP1.style.width = '0%';
            specialP2.style.width = '0%';
        }
    }

    // --- COLLISION ---
    function rectCollide(r1, r2) {
        return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x ||
            r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
    }

    // --- PARTICLES ---
    function spawnParticles(x, y, color, count = 15, speed = 5, size = 5) {
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const s = 1 + Math.random() * speed;
            particles.push({
                x: x + (Math.random() - 0.5) * 10,
                y: y + (Math.random() - 0.5) * 10,
                vx: Math.cos(a) * s,
                vy: Math.sin(a) * s - 2,
                life: 20 + Math.random() * 30,
                maxLife: 50,
                size: 2 + Math.random() * size,
                color: color || '#ffdd44',
                gravity: 0.1
            });
        }
    }

    function spawnExplosion(x, y) {
        const colors = ['#ff6b00', '#f7d44a', '#ff0000', '#ff8800', '#ffffff', '#ffaa00'];
        for (let i = 0; i < 70; i++) {
            const a = Math.random() * Math.PI * 2;
            const s = 2 + Math.random() * 14;
            particles.push({
                x: x + (Math.random() - 0.5) * 50,
                y: y + (Math.random() - 0.5) * 50,
                vx: Math.cos(a) * s,
                vy: Math.sin(a) * s - 4,
                life: 20 + Math.random() * 40,
                maxLife: 60,
                size: 3 + Math.random() * 12,
                color: colors[Math.floor(Math.random() * colors.length)],
                gravity: 0.15
            });
        }
        shakeAmount = 10;
        flashOverlay.style.opacity = '0.3';
        setTimeout(() => flashOverlay.style.opacity = '0', 100);
        audio.playSpecial();
    }

    function spawnTextEffect(x, y, text, color, size = 30) {
        textEffects.push({
            x, y, text, color, size,
            life: 60, maxLife: 60,
            vy: -2, alpha: 1
        });
    }

    // --- APPLY DAMAGE ---
    function applyDamage(attacker, defender, isP1, isSpecial = false) {
        if (defender.hitCooldown > 0 || gameOver) return false;

        const range = isSpecial ? attacker.range * 1.6 : attacker.range;
        const ax = attacker.direction === 1 ? attacker.x + attacker.w : attacker.x - range;
        const bx = { x: defender.x + 4, y: defender.y + 6, w: defender.w - 8, h: defender.h - 14 };
        const pb = { x: ax, y: attacker.y + 4, w: range, h: attacker.h - 12 };

        if (!rectCollide(pb, bx)) return false;

        const dmg = isSpecial ? attacker.specialDamage : (attacker.damage + Math.floor(Math.random() * 4));
        defender.health = Math.max(0, defender.health - Math.min(dmg, defender.health));
        defender.hitCooldown = isSpecial ? 22 : 16;
        defender.hitEffectTimer = 10;
        defender.expression = 'hurt';
        defender.expressionTimer = 15;

        const hx = defender.x + defender.w / 2;
        const hy = defender.y + defender.h / 2;

        if (isSpecial) {
            spawnExplosion(hx, hy);
            spawnTextEffect(hx, hy - 30, '💥 SUPER!', '#ff6b00', 40);
        } else {
            spawnParticles(hx, hy, '#ffdd44', 15, 6);
            spawnTextEffect(hx, hy - 20, '-' + dmg, '#ff4444', 25);
            audio.playHit();
        }

        const push = isSpecial ? 55 : 30;
        defender.x += (isP1 ? 1 : -1) * push;
        defender.x = Math.max(10, Math.min(W - defender.w - 10, defender.x));

        const now = Date.now();
        if (now - attacker.lastHitTime < 2000) comboCount++;
        else comboCount = 1;
        attacker.lastHitTime = now;
        comboTimer = 70;

        if (comboCount >= 2) showCombo(comboCount);

        attacker.special = Math.min(attacker.maxSpecial, attacker.special + (isSpecial ? 2 : 8));
        defender.special = Math.min(defender.maxSpecial, defender.special + 3);
        updateHUD();

        if (defender.health <= 0) {
            gameOver = true;
            winner = isP1 ? 'p1' : 'p2';
            spawnExplosion(defender.x + defender.w / 2, defender.y + defender.h / 2);
            spawnTextEffect(W / 2, H / 2 - 80, '🏆 K.O.!', '#f7d44a', 60);
            updateHUD();
        }
        return true;
    }

    // --- SHOW COMBO ---
    function showCombo(count) {
        const isMega = count >= 5;
        comboDisplay.textContent = isMega ? `${count}x MEGA COMBO!` : `${count}x COMBO!`;
        comboDisplay.className = 'combo-display' + (isMega ? ' mega' : '');
        comboDisplay.style.opacity = '1';
        spawnTextEffect(W / 2, H / 2 - 100, comboDisplay.textContent, isMega ? '#ff4400' : '#f7d44a', isMega ? 50 : 35);

        clearTimeout(comboDisplay._t);
        comboDisplay._t = setTimeout(() => {
            comboDisplay.style.opacity = '0';
            setTimeout(() => comboDisplay.className = 'combo-display', 300);
        }, 1000);
    }

    // --- BOT AI ---
    function updateBot() {
        if (!p2 || !gameStarted || gameOver || !p1) return;
        if (gameMode !== 'bot') return;

        const diff = difficulty;
        
        let reactionTime, accuracy, aggression, specialChance, reactionBonus, speedMult;
        
        switch(diff) {
            case 'easy':
                reactionTime = 30;
                accuracy = 0.25;
                aggression = 0.12;
                specialChance = 0.02;
                reactionBonus = 0;
                speedMult = 0.7;
                break;
            case 'medium':
                reactionTime = 20;
                accuracy = 0.5;
                aggression = 0.28;
                specialChance = 0.05;
                reactionBonus = 0.05;
                speedMult = 0.85;
                break;
            case 'hard':
                reactionTime = 12;
                accuracy = 0.75;
                aggression = 0.45;
                specialChance = 0.09;
                reactionBonus = 0.12;
                speedMult = 1.0;
                break;
            case 'impossible':
                reactionTime = 6;
                accuracy = 0.95;
                aggression = 0.7;
                specialChance = 0.18;
                reactionBonus = 0.25;
                speedMult = 1.2;
                break;
            default:
                reactionTime = 20;
                accuracy = 0.5;
                aggression = 0.28;
                specialChance = 0.05;
                reactionBonus = 0;
                speedMult = 0.85;
        }

        botTimer++;

        const dist = Math.abs(p2.x - p1.x);
        const distThreshold = diff === 'easy' ? 200 : diff === 'medium' ? 160 : diff === 'hard' ? 120 : 80;

        if (botCooldown > 0) {
            botCooldown--;
            return;
        }

        if (botTimer % Math.max(3, reactionTime - Math.floor(reactionBonus * 5)) === 0) {
            const rand = Math.random();

            if (dist < distThreshold) {
                if (rand < aggression) {
                    if (p2.special >= SPECIAL_COST && rand < specialChance) {
                        botAction = 'special';
                        p2.special -= SPECIAL_COST;
                        p2.punching = true;
                        p2.punchTimer = PUNCH_DURATION + 8;
                        p2.cooldown = PUNCH_COOLDOWN + 4;
                        spawnExplosion(p2.x + (p2.direction === -1 ? 0 : p2.w), p2.y + p2.h / 2);
                        applyDamage(p2, p1, false, true);
                        updateHUD();
                        specialP2.classList.remove('full');
                        botCooldown = 10;
                    } else if (rand < aggression * 1.5) {
                        botAction = 'punch';
                        p2.punching = true;
                        p2.punchTimer = PUNCH_DURATION;
                        p2.cooldown = PUNCH_COOLDOWN;
                        if (Math.random() < accuracy) {
                            applyDamage(p2, p1, false, false);
                        }
                        botCooldown = 5;
                    } else {
                        if (p2.onGround) {
                            botAction = 'jump';
                            p2.vy = p2.jumpPower;
                            p2.onGround = false;
                            p2.isJumping = true;
                            botCooldown = 8;
                        }
                    }
                } else if (rand < 0.25 + (1 - accuracy) * 0.3) {
                    botAction = 'retreat';
                    const dir = p2.x < p1.x ? -1 : 1;
                    p2.x += dir * p2.speed * speedMult * 0.5;
                    p2.x = Math.max(6, Math.min(W - p2.w - 6, p2.x));
                    botCooldown = 5;
                } else {
                    botAction = 'advance';
                    const dir = p2.x < p1.x ? 1 : -1;
                    p2.x += dir * p2.speed * speedMult * 0.7;
                    p2.x = Math.max(6, Math.min(W - p2.w - 6, p2.x));
                    botCooldown = 3;
                }
            } else {
                botAction = 'approach';
                const dir = p2.x < p1.x ? 1 : -1;
                p2.x += dir * p2.speed * speedMult * 0.8;
                p2.x = Math.max(6, Math.min(W - p2.w - 6, p2.x));
                botCooldown = 3;
            }
        }

        p2.direction = p2.x < p1.x ? 1 : -1;
    }

    // --- UPDATE ---
    function update() {
        if (!gameStarted || gameOver || !p1 || !p2) return;

        frameCount++;
        const GY = STAGES[selectedStage].groundY || 355;

        if (gameMode === 'bot') {
            updateBot();
        }

        [p1, p2].forEach(p => {
            p.breathPhase += 0.03;
            p.animTimer++;
            if (p.animTimer > 8) {
                p.animTimer = 0;
                p.animFrame = (p.animFrame + 1) % 4;
            }
            if (p.hitCooldown > 0) p.hitCooldown--;
            if (p.cooldown > 0) p.cooldown--;
            if (p.punchTimer > 0) p.punchTimer--;
            if (p.punchTimer === 0 && p.punching) p.punching = false;
            if (p.hitEffectTimer > 0) p.hitEffectTimer--;
            if (p.expressionTimer > 0) {
                p.expressionTimer--;
                if (p.expressionTimer === 0) p.expression = 'neutral';
            }
        });

        if (comboTimer > 0 && --comboTimer === 0) {
            comboCount = 0;
            comboDisplay.style.opacity = '0';
        }

        if (keys.w && p1.onGround && !gameOver) {
            p1.vy = p1.jumpPower;
            p1.onGround = false;
            p1.isJumping = true;
            spawnParticles(p1.x + p1.w / 2, p1.y + p1.h, '#88ccff', 8, 3);
        }
        
        if (!(gameMode === 'bot')) {
            if (keys.up && p2.onGround && !gameOver) {
                p2.vy = p2.jumpPower;
                p2.onGround = false;
                p2.isJumping = true;
                spawnParticles(p2.x + p2.w / 2, p2.y + p2.h, '#88ccff', 8, 3);
            }
        }

        [p1, p2].forEach(p => {
            p.vy += GRAVITY;
            p.y += p.vy;
            if (p.y >= GY - p.h) {
                p.y = GY - p.h;
                p.vy = 0;
                p.onGround = true;
                p.isJumping = false;
            }
            if (frameCount % 2 === 0 && Math.abs(p.vy) > 1) {
                p.trail.push({ x: p.x + p.w / 2, y: p.y + p.h, life: 12 });
            }
            p.trail = p.trail.filter(t => --t.life > 0);
        });

        if (keys.a && p1.x > 6) { p1.x -= p1.speed; p1.direction = -1; }
        if (keys.d && p1.x < W - p1.w - 6) { p1.x += p1.speed; p1.direction = 1; }
        
        if (!(gameMode === 'bot')) {
            if (keys.left && p2.x > 6) { p2.x -= p2.speed; p2.direction = -1; }
            if (keys.right && p2.x < W - p2.w - 6) { p2.x += p2.speed; p2.direction = 1; }
        }

        if (keys.j && !p1.punching && p1.cooldown === 0 && !gameOver) {
            p1.punching = true;
            p1.punchTimer = PUNCH_DURATION;
            p1.cooldown = PUNCH_COOLDOWN;
            applyDamage(p1, p2, true, false);
        }
        
        if (!(gameMode === 'bot')) {
            if (keys.l && !p2.punching && p2.cooldown === 0 && !gameOver) {
                p2.punching = true;
                p2.punchTimer = PUNCH_DURATION;
                p2.cooldown = PUNCH_COOLDOWN;
                applyDamage(p2, p1, false, false);
            }
        }

        if (keys.k && p1.special >= SPECIAL_COST && !gameOver) {
            p1.special -= SPECIAL_COST;
            p1.punching = true;
            p1.punchTimer = PUNCH_DURATION + 8;
            p1.cooldown = PUNCH_COOLDOWN + 4;
            spawnExplosion(p1.x + (p1.direction === 1 ? p1.w : 0), p1.y + p1.h / 2);
            applyDamage(p1, p2, true, true);
            updateHUD();
            specialP1.classList.remove('full');
        }
        
        if (!(gameMode === 'bot')) {
            if (keys.ç && p2.special >= SPECIAL_COST && !gameOver) {
                p2.special -= SPECIAL_COST;
                p2.punching = true;
                p2.punchTimer = PUNCH_DURATION + 8;
                p2.cooldown = PUNCH_COOLDOWN + 4;
                spawnExplosion(p2.x + (p2.direction === -1 ? 0 : p2.w), p2.y + p2.h / 2);
                applyDamage(p2, p1, false, true);
                updateHUD();
                specialP2.classList.remove('full');
            }
        }

        if (rectCollide(p1, p2)) {
            if (p1.x < p2.x) { p1.x -= 4; p2.x += 4; }
            else { p1.x += 4; p2.x -= 4; }
            p1.x = Math.max(6, Math.min(W - p1.w - 6, p1.x));
            p2.x = Math.max(6, Math.min(W - p2.w - 6, p2.x));
        }

        if (!gameOver) {
            p1.special = Math.min(p1.maxSpecial, p1.special + 0.15);
            if (gameMode === 'bot') {
                const botBonus = difficulty === 'easy' ? 0.1 : difficulty === 'medium' ? 0.2 : difficulty === 'hard' ? 0.35 : 0.5;
                p2.special = Math.min(p2.maxSpecial, p2.special + 0.15 + botBonus);
            } else {
                p2.special = Math.min(p2.maxSpecial, p2.special + 0.15);
            }
        }

        particles = particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += (p.gravity || 0.1);
            return --p.life > 0;
        });
        hitSparks = hitSparks.filter(s => --s.life > 0);
        textEffects = textEffects.filter(t => {
            t.y += t.vy;
            t.life--;
            t.alpha = t.life / t.maxLife;
            return t.life > 0;
        });

        if (shakeAmount > 0) shakeAmount *= 0.92;
        if (shakeAmount < 0.1) shakeAmount = 0;

        updateHUD();
    }

    // --- DRAW ---
    function draw() {
        ctx.save();

        if (shakeAmount > 0.5) {
            const sx = (Math.random() - 0.5) * shakeAmount * 1.5;
            const sy = (Math.random() - 0.5) * shakeAmount * 1.5;
            ctx.translate(sx, sy);
        }

        ctx.clearRect(-10, -10, W + 20, H + 20);

        const stage = STAGES[selectedStage];
        if (stage) {
            stage.draw();
        }

        if (p1 && p2) {
            [p1, p2].forEach(p => {
                p.trail.forEach(t => {
                    ctx.globalAlpha = t.life / 15 * 0.15;
                    const trailColor = p.skin.accent || '#ffdd44';
                    ctx.fillStyle = trailColor;
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = trailColor;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, 5 * (t.life / 15), 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            });
        }

        particles.forEach(p => {
            ctx.globalAlpha = p.life / p.maxLife;
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 30;
            ctx.shadowColor = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;

        textEffects.forEach(t => {
            ctx.globalAlpha = t.alpha;
            ctx.font = `bold ${t.size}px "Black Ops One", "Orbitron", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 40;
            ctx.shadowColor = 'rgba(0,0,0,0.9)';
            ctx.fillStyle = t.color;
            ctx.shadowColor = t.color + '40';
            ctx.shadowBlur = 60;
            ctx.fillText(t.text, t.x, t.y);
            ctx.shadowBlur = 0;
        });
        ctx.globalAlpha = 1;

        if (p1 && p2) {
            if (p1.x < p2.x) {
                drawFighter(p1);
                drawFighter(p2);
            } else {
                drawFighter(p2);
                drawFighter(p1);
            }
        }

        if (gameOver && p1 && p2) {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, W, H);

            const grad2 = ctx.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, 350);
            grad2.addColorStop(0, 'rgba(247,212,74,0.08)');
            grad2.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad2;
            ctx.fillRect(0, 0, W, H);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#000000cc';
            ctx.shadowBlur = 50;

            const name = winner === 'p1' ? p1.charName : p2.charName;
            const emoji = winner === 'p1' ? CHARACTERS[selectedP1].emoji : CHARACTERS[selectedP2].emoji;

            ctx.font = 'bold 56px "Black Ops One", "Orbitron", sans-serif';
            ctx.shadowColor = '#000000';
            ctx.shadowBlur = 60;
            ctx.fillStyle = '#f7e05e';
            ctx.fillText(`🏆 ${emoji} ${name}`, W / 2, H / 2 - 15);

            ctx.font = '18px "Rajdhani", "Segoe UI", sans-serif';
            ctx.shadowBlur = 30;
            ctx.fillStyle = 'rgba(179, 213, 245, 0.7)';
            ctx.fillText('PRESS RESET FOR A NEW BATTLE', W / 2, H / 2 + 55);

            ctx.shadowBlur = 0;
        }

        if (p1 && p2 && !gameOver) {
            const GY = STAGES[selectedStage].groundY || 355;
            ctx.font = '600 14px "Rajdhani", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 12;
            const p1Name = nameSystem.getPlayerName('p1') || p1.charName;
            const p2Name = gameMode === 'bot' ? '🤖 BOT' : (nameSystem.getPlayerName('p2') || p2.charName);
            ctx.fillText(p1Name, p1.x + p1.w / 2, GY + 34);
            ctx.fillText(p2Name, p2.x + p2.w / 2, GY + 34);
            ctx.shadowBlur = 0;
        }

        if (p1 && p2 && !gameOver) {
            [p1, p2].forEach((p, i) => {
                if (p.special >= SPECIAL_COST) {
                    const x = i === 0 ? 20 : W - 60;
                    const y = 20;
                    const pulse = Math.sin(frameCount * 0.05) * 0.3 + 0.7;
                    ctx.fillStyle = `rgba(247,212,74,${0.15 * pulse})`;
                    ctx.shadowColor = '#f7d44a';
                    ctx.shadowBlur = 30 * pulse;
                    ctx.beginPath();
                    ctx.arc(x, y, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#f7d44a';
                    ctx.shadowBlur = 40 * pulse;
                    ctx.font = '18px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⚡', x, y + 1);
                    ctx.shadowBlur = 0;
                }
            });
        }

        ctx.restore();
    }

    // --- GAME LOOP ---
    function gameLoop(timestamp) {
        const dt = timestamp - lastTime;
        lastTime = timestamp;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // --- CHARACTER SELECTION ---
    charCards.forEach(card => {
        card.addEventListener('click', () => {
            const key = card.dataset.char;

            if (selectionPhase === 'p1') {
                charCards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedP1 = key;
                const p1Name = nameSystem.getPlayerName('p1') || 'P1';
                p1Preview.textContent = `${p1Name}: ${CHARACTERS[key].emoji} ${CHARACTERS[key].name}`;
                selectionPhase = 'p2';
                selectInstruction.textContent = gameMode === 'pvp' ? 
                    '✦ PLAYER 2, CHOOSE YOUR CHAMPION ✦' : 
                    '✦ CHOOSE BOT\'S FIGHTER ✦';
                startBtn.disabled = true;
            } else if (selectionPhase === 'p2') {
                charCards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedP2 = key;
                const p2Name = gameMode === 'bot' ? '🤖 BOT' : (nameSystem.getPlayerName('p2') || 'P2');
                p2Preview.textContent = `${p2Name}: ${CHARACTERS[key].emoji} ${CHARACTERS[key].name}`;
                startBtn.disabled = false;
                selectInstruction.textContent = '✦ READY FOR BATTLE! ✦';
            }
        });
    });

    // --- START ---
    startBtn.addEventListener('click', () => {
        if (selectedP1 && selectedP2) {
            initGame();
            if (audio.enabled && audio.ctx.state === 'suspended') {
                audio.ctx.resume();
            }
        }
    });

    // --- MENU ---
    menuBtn.addEventListener('click', goToMenu);

    // --- RESET ---
    resetBtn.addEventListener('click', () => {
        if (gameStarted) {
            resetFight();
        } else {
            goToMenu();
        }
    });

    // --- KEYBOARD ---
    window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        const controlKeys = ['a', 'd', 'w', 'j', 'k', 'arrowleft', 'arrowright', 'arrowup', 'l', 'ç', ';'];
        if (controlKeys.includes(k) || k === 'arrowleft' || k === 'arrowright' || k === 'arrowup') {
            e.preventDefault();
        }
        if (k === 'a') keys.a = true;
        if (k === 'd') keys.d = true;
        if (k === 'w') keys.w = true;
        if (k === 'j') keys.j = true;
        if (k === 'k') keys.k = true;
        if (k === 'arrowleft') keys.left = true;
        if (k === 'arrowright') keys.right = true;
        if (k === 'arrowup') keys.up = true;
        if (k === 'l') keys.l = true;
        if (k === 'ç' || k === ';') keys.ç = true;
    });

    window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (k === 'a') keys.a = false;
        if (k === 'd') keys.d = false;
        if (k === 'w') keys.w = false;
        if (k === 'j') keys.j = false;
        if (k === 'k') keys.k = false;
        if (k === 'arrowleft') keys.left = false;
        if (k === 'arrowright') keys.right = false;
        if (k === 'arrowup') keys.up = false;
        if (k === 'l') keys.l = false;
        if (k === 'ç' || k === ';') keys.ç = false;
    });

    // --- START ---
    requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
